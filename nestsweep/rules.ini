; Nestsweep cleaning rules.
; Format: winapp2-style sections (see the docstring in custom_clean.py).
; Recursive rules only run on folders that pass safety.cleanup_base_ok.

[Rule Vars]
CHROME_PROFILES=%LocalAppData%\Google\Chrome\User Data\Default,%LocalAppData%\Google\Chrome\User Data\Profile *
EDGE_PROFILES=%LocalAppData%\Microsoft\Edge\User Data\Default,%LocalAppData%\Microsoft\Edge\User Data\Profile *
BRAVE_PROFILES=%LocalAppData%\BraveSoftware\Brave-Browser\User Data\Default,%LocalAppData%\BraveSoftware\Brave-Browser\User Data\Profile *

; ------------------------------------------------------------- Windows

[User Temporary Files]
ID=windows.user_temp
Default=True
Tags=System,Temp
FileKey1=%TEMP%|*|RECURSE

[System Temporary Files]
ID=windows.system_temp
Default=True
Tags=System,Temp
FileKey1=%WinDir%\Temp|*|RECURSE

[Empty Recycle Bin]
ID=windows.recyclebin
Default=True
Tags=System
Action1=EmptyRecycleBin

[Thumbnail Cache]
ID=windows.thumbnails
Default=False
Tags=System
DetectOS=6.0
FileKey1=%LocalAppData%\Microsoft\Windows\Explorer|thumbcache_*.db;iconcache_*.db

[Windows Error Reporting]
ID=windows.wer
Default=True
Tags=System,Logs
FileKey1=%ProgramData%\Microsoft\Windows\WER\ReportArchive|*|RECURSE
FileKey2=%ProgramData%\Microsoft\Windows\WER\ReportQueue|*|RECURSE
FileKey3=%LocalAppData%\Microsoft\Windows\WER|*|RECURSE

[Memory Dumps]
ID=windows.memory_dumps
Default=False
Tags=System
FileKey1=%WinDir%|MEMORY.DMP
FileKey2=%WinDir%\Minidump|*.dmp
FileKey3=%LocalAppData%\CrashDumps|*.dmp

[Windows Log Files]
ID=windows.logs
Default=True
Tags=System,Logs
FileKey1=%WinDir%\Logs\CBS|*.log;*.cab
FileKey2=%WinDir%\Panther|*.log
FileKey3=%WinDir%\Logs\DISM|*.log
ExcludeKey1=FILE|%WinDir%\Logs\CBS\CBS.log

[DirectX Shader Cache]
ID=windows.d3dscache
Default=True
Tags=System,Cache
FileKey1=%LocalAppData%\D3DSCache|*|RECURSE
FileKey2=%LocalAppData%\NVIDIA\DXCache|*|RECURSE
FileKey3=%LocalAppData%\AMD\DxCache|*|RECURSE

[Delivery Optimization Cache]
ID=windows.delivery_optimization
Default=False
Tags=System,Cache
FileKey1=%WinDir%\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\DeliveryOptimization\Cache|*|RECURSE

[Recent Documents List]
ID=windows.recent_docs
Default=False
Tags=Privacy
FileKey1=%Recent%|*.lnk
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RecentDocs

[Run Dialog History]
ID=windows.run_mru
Default=False
Tags=Privacy
RegKey1=HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU

[Clipboard]
ID=windows.clipboard
Default=False
Tags=Privacy
Action1=CleanClipboard

[DNS Cache]
ID=windows.dns_cache
Default=True
Tags=Network
Action1=CleanDNSCache

; ------------------------------------------------------------- Browsers

[Google Chrome - Cache]
ID=chrome.cache
Default=True
Tags=Browser,Chrome
DetectFile=%LocalAppData%\Google\Chrome\User Data
ActiveProcesses=chrome.exe
FileKey1=<CHROME_PROFILES>\Cache|*|RECURSE
FileKey2=<CHROME_PROFILES>\Code Cache|*|RECURSE
FileKey3=<CHROME_PROFILES>\GPUCache|*|RECURSE
FileKey4=%LocalAppData%\Google\Chrome\User Data\ShaderCache|*|RECURSE

[Microsoft Edge - Cache]
ID=edge.cache
Default=True
Tags=Browser,Edge
DetectFile=%LocalAppData%\Microsoft\Edge\User Data
ActiveProcesses=msedge.exe
FileKey1=<EDGE_PROFILES>\Cache|*|RECURSE
FileKey2=<EDGE_PROFILES>\Code Cache|*|RECURSE
FileKey3=<EDGE_PROFILES>\GPUCache|*|RECURSE

[Brave - Cache]
ID=brave.cache
Default=True
Tags=Browser,Brave
DetectFile=%LocalAppData%\BraveSoftware\Brave-Browser\User Data
ActiveProcesses=brave.exe
FileKey1=<BRAVE_PROFILES>\Cache|*|RECURSE
FileKey2=<BRAVE_PROFILES>\Code Cache|*|RECURSE

[Firefox - Cache]
ID=firefox.cache
Default=True
Tags=Browser,Firefox
DetectFile=%LocalAppData%\Mozilla\Firefox\Profiles
ActiveProcesses=firefox.exe
FileKey1=%LocalAppData%\Mozilla\Firefox\Profiles\*\cache2|*|RECURSE
FileKey2=%LocalAppData%\Mozilla\Firefox\Profiles\*\startupCache|*|RECURSE

; ------------------------------------------------------------- Applications

[Discord - Cache]
ID=discord.cache
Default=False
Tags=Applications
DetectFile=%AppData%\discord
ActiveProcesses=discord.exe
FileKey1=%AppData%\discord\Cache|*|RECURSE
FileKey2=%AppData%\discord\Code Cache|*|RECURSE
FileKey3=%AppData%\discord\GPUCache|*|RECURSE

[Steam - HTML Cache]
ID=steam.htmlcache
Default=False
Tags=Applications
DetectFile=%LocalAppData%\Steam\htmlcache
ActiveProcesses=steam.exe,steamwebhelper.exe
FileKey1=%LocalAppData%\Steam\htmlcache|*|RECURSE

[pip Cache]
ID=dev.pip_cache
Default=False
Tags=Developer
DetectFile=%LocalAppData%\pip\Cache
FileKey1=%LocalAppData%\pip\Cache|*|RECURSE

[npm Cache]
ID=dev.npm_cache
Default=False
Tags=Developer
DetectFile=%LocalAppData%\npm-cache
FileKey1=%LocalAppData%\npm-cache\_cacache|*|RECURSE
