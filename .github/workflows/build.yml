name: Build Nestsweep.exe

on:
  push:
    branches: [main]
    tags: ["v*"]             # publishing a release creates its tag, which builds and attaches the exe
  pull_request:
  release:
    types: [published]
  workflow_dispatch:         # Actions tab -> Run workflow -> type a tag (e.g. v1.0.3) to (re)attach its exe
    inputs:
      tag:
        description: "Release tag to build and attach the exe to (leave empty to just build main)"
        required: false

# One release build per tag at a time (a release publish fires both the tag push and the release event).
concurrency:
  group: build-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Lint (undefined names, unused imports)
        run: |
          python -m pip install pyflakes==3.2.0
          python -m pyflakes nestsweep tests run_nestsweep.py
      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # Surface the failure text as an annotation so it shows on the run page and in the API.
            $t = (Get-Content test.log -Raw) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'
            Write-Output "::error title=Tests failed::$t"
          }
          exit $code
      - name: Build
        run: python -m PyInstaller --noconfirm --clean nestsweep.spec
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/Nestsweep.exe -Algorithm SHA256).Hash
          "$h  Nestsweep.exe" | Set-Content dist/Nestsweep.exe.sha256
          "SHA256 $h" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Nestsweep
          path: dist/Nestsweep.exe*

  release:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Nestsweep
          path: dist
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          files: |
            dist/Nestsweep.exe
            dist/Nestsweep.exe.sha256
